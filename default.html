<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {{ site.title | default: 'Your Name' }}{% else %}{{ site.title | default: 'Your Name' }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | default: 'Your Name' }}</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url contains 'research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url contains 'cv' %} aria-current="page"{% endif %}>CV</a>
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ 'now' | date: '%Y' }} {{ site.title | default: 'Your Name' }}</p>
    </div>
  </footer>
</body>
</html>
