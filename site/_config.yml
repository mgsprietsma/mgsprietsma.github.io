# ------------------------------------------------------------
# Site settings. Edit the values below, then commit and push.
# ------------------------------------------------------------
title: Maria Lastname
description: Astronomer studying protoplanetary disks, infalling streamers, and young stellar systems with ALMA.
lang: en

# How your name appears in author lists. Every occurrence is
# shown in bold on the Publications page. Match it exactly to
# how you write it in _data/publications.yml.
author_name: "Lastname, M."

# Banner image across the top of every page.
# Put your image at this path (jpg, png or webp all work).
header_image: /assets/images/header.jpg
header_image_alt: "Describe the image here, e.g. ALMA image of a protoplanetary disk"
header_image_credit: ""          # optional, e.g. "Image: ALMA (ESO/NAOJ/NRAO)"
header_image_position: center    # which part of the image stays in view: center, top, bottom, "50% 30%"

# Your CV. Put the PDF at this path.
cv_pdf: /assets/cv.pdf
cv_updated: "November 2026"

# Links shown in the footer and on the landing page.
links:
  - label: Email
    url: mailto:you@university.edu
  - label: GitHub
    url: https://github.com/yourusername
  - label: ORCID
    url: https://orcid.org/0000-0000-0000-0000
  - label: NASA ADS
    url: https://ui.adsabs.harvard.edu/

# Build settings. No theme line on purpose: the site uses its own layout.
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
